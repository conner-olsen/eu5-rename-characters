l_french:
 RCH_RENAME_CHARACTER_MENU_ITEM_TEXT: "[SelectLocalization(GetPlayer.HasVariable('rch_marked_character'), 'RCH_RENAME_CHARACTER_TEXT', 'RCH_NO_MARKED_CHARACTER_TEXT')]"
 RCH_CHANGE_CHARACTER_NAME_SUBTITLE: "Changer le nom d'un personnage"
 RCH_EDITBOX_DEFAULT: "[SelectLocalization(GetPlayer.HasVariable('rch_marked_character'), 'RCH_EDITBOX_PLACEHOLDER', 'RCH_NO_MARKED_CHARACTER_TEXT')]"
 RCH_EDITBOX_PLACEHOLDER: "[Localize('RENAME')] [GetVariableSystem.Get('rch_character_to_rename')]"
 RCH_RENAME_CHARACTER_TEXT: "Renommer le personnage"
 RCH_NO_MARKED_CHARACTER_TEXT: "Aucun personnage marqué !"
 RCH_EDIT_CHARACTER_NAME: "Nous pouvons renommer notre [character|e] comme bon nous semble. Cela refléterait bien mal votre propre caractère si vous choisissiez un nom trop dérisoire."
 RCH_CLOSE_BUTTON: "Fermer"
 RCH_CHANGE_THE_NAME: "[SelectLocalization(GetPlayer.HasVariable('rch_marked_character'), 'CHANGE_THE_NAME', 'RCH_NO_MARKED_CHARACTER_TEXT')]"
 RCH_CHANGE_CHARACTER_NAME_TITLE: "$RCH_RENAME_CHARACTER_TEXT$"
 RCH_RENAME_DYNASTY_MENU_ITEM_TEXT: "[SelectLocalization(GetPlayer.HasVariable('rch_marked_character'), 'RCH_RENAME_DYNASTY_TEXT', 'RCH_NO_MARKED_CHARACTER_TEXT')]"
 RCH_CHANGE_DYNASTY_NAME_SUBTITLE: "Changer le nom d'une dynastie"
 RCH_DYNASTY_EDITBOX_DEFAULT: "[SelectLocalization(GetPlayer.HasVariable('rch_marked_character'), 'RCH_DYNASTY_EDITBOX_PLACEHOLDER', 'RCH_NO_MARKED_CHARACTER_TEXT')]"
 RCH_DYNASTY_EDITBOX_PLACEHOLDER: "[Localize('RENAME')] [GetVariableSystem.Get('rch_dynasty_to_rename')]"
 RCH_RENAME_DYNASTY_TEXT: "Renommer la dynastie"
 RCH_EDIT_DYNASTY_NAME: "Nous pouvons renommer notre [dynasty|e] à notre guise. Cela nuirait à la réputation de votre propre dynastie si vous veniez à choisir un nom trop insignifiant."
 RCH_CHANGE_DYNASTY_NAME_TITLE: "$RCH_RENAME_DYNASTY_TEXT$"
 RCH_RENAME_DYNASTY_DISABLED_TT: "Renommer les dynasties nécessite une sauvegarde créée avec ce mod activé."
