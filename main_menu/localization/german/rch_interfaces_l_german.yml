 RCH_DYNASTY_EDITBOX_DEFAULT: "[SelectLocalization(GetPlayer.HasVariable('rch_marked_character'), 'RCH_DYNASTY_EDITBOX_PLACEHOLDER', 'RCH_NO_MARKED_CHARACTER_TEXT')]"
 RCH_DYNASTY_EDITBOX_PLACEHOLDER: "[Localize('RENAME')] [GetVariableSystem.Get('rch_dynasty_to_rename')]"
 RCH_RENAME_DYNASTY_TEXT: "Dynastie umbenennen"
 RCH_EDIT_DYNASTY_NAME: "Wir können unseren [dynasty|e] nach Belieben umbenennen. Es wirft ein schlechtes Licht auf Eure eigene Dynastie, solltet Ihr einen gar zu geringfügigen Namen wählen."
 RCH_CHANGE_DYNASTY_NAME_TITLE: "$RCH_RENAME_DYNASTY_TEXT$"
