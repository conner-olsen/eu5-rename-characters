 RCH_RENAME_CHARACTER_TEXT: "Charakter umbenennen"
 RCH_NO_MARKED_CHARACTER_TEXT: "Kein markierter Charakter!"
 RCH_EDIT_CHARACTER_NAME: "Wir können unseren [character|e] nach Belieben umbenennen. Es würde ein schlechtes Licht auf Euren eigenen Charakter werfen, solltet Ihr einen allzu geringfügigen Namen wählen."
 RCH_CLOSE_BUTTON: "Schließen"
 RCH_CHANGE_THE_NAME: "[SelectLocalization(GetPlayer.HasVariable('rch_marked_character'), 'CHANGE_THE_NAME', 'RCH_NO_MARKED_CHARACTER_TEXT')]"
